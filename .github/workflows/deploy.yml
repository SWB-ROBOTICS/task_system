name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: task-system-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - run: docker build -t task-system:ci .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Key is restricted server-side (authorized_keys forced command) to
          # /srv/stacks/task-system/deploy.sh, whatever is sent here.
          script: /srv/stacks/task-system/deploy.sh
          command_timeout: 10m
